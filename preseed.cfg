# =====================================================================
# DEBIAN AUTOMATED PRESEED FILE: FULL DISK LVM ENCRYPTION
# (MANUAL: HOSTNAME, DISK SELECTION, ENCRYPTION PASSPHRASE)
# =====================================================================

# ---------------------------------------------------------------------
# 1. Localization & Language
# ---------------------------------------------------------------------
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# ---------------------------------------------------------------------
# 2. Network Configuration (Fixes Wi-Fi "Invalid Passphrase" Loop)
# ---------------------------------------------------------------------
# Force the installer to ask for interface & show Wi-Fi list cleanly
d-i netcfg/choose_interface select ask
d-i netcfg/wireless_show_essids select true
d-i netcfg/wireless_security_type select wpa

# Prompt the user for the Hostname during installation
# (Left unconfigured so the installer asks)
d-i netcfg/get_domain string local
d-i netcfg/wireless_wpa string

# ---------------------------------------------------------------------
# 3. Mirror Settings
# ---------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ---------------------------------------------------------------------
# 4. Account Setup: SKIP ROOT & SET SUDO USER
# ---------------------------------------------------------------------
# Disable root account creation (Locks root account & enables sudo for primary user)
d-i passwd/root-login boolean false

# Normal User Account
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Debian User
d-i passwd/username string debian
d-i passwd/user-password password ChangeMe123!
d-i passwd/user-password-again password ChangeMe123!

# ---------------------------------------------------------------------
# 5. Clock and Timezone
# ---------------------------------------------------------------------
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# ---------------------------------------------------------------------
# 6. Disk Partitioning: FULL DISK LVM ENCRYPTION (LUKS)
# ---------------------------------------------------------------------
# Prompt the user to select the disk manually
d-i partman-auto/disk string ask_device
d-i partman-auto/method string crypto

# Automatically confirm wiping existing LVM/Array setups on chosen disk
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Prompt the user to enter the encryption passphrase manually
# (Left unconfigured so the installer asks)

# Choose partitioning recipe: 'atomic' puts everything in / (plus /boot & swap)
d-i partman-auto/choose_recipe select atomic

# Suppress warnings & auto-confirm partition tables after user input
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-crypto/confirm boolean true
d-i partman-crypto/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true

# Erase disk with random data before encrypting (Set to false for faster installs)
d-i partman-crypto/erase_data boolean false

# ---------------------------------------------------------------------
# 7. Package Selection & Installation
# ---------------------------------------------------------------------
tasksel tasksel/first multiselect standard
d-i pkgsel/include string sudo openssh-server curl
d-i pkgsel/upgrade select full-upgrade
d-i popularity-contest/participate boolean false

# ---------------------------------------------------------------------
# 8. Bootloader Setup
# ---------------------------------------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# ---------------------------------------------------------------------
# 9. Finishing Installation
# ---------------------------------------------------------------------
d-i finish-install/reboot_in_progress note
